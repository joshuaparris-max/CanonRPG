name: Build Canon Table Engine

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Canon Table Engine
        env:
          BASE_PATH: /CanonRPG/
        run: pnpm --filter @workspace/canon-table-engine run build
      - name: Preserve built site artifact
        uses: actions/upload-artifact@v4
        with:
          name: canon-table-engine-site
          path: artifacts/canon-table-engine/dist/public
          if-no-files-found: error
